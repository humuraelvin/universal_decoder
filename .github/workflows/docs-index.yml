name: Generate documentation index

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docs index
        run: |
          mkdir -p docs/automation
          {
            echo "# Documentation Index"
            echo
            echo 'Generated from the Markdown files in the `docs/` folder.'
            echo
            find docs -type f -name '*.md' ! -path 'docs/automation/generated-index.md' | sort | while IFS= read -r path; do
              base="${path##*/}"
              label="${base%.md}"
              label="${label//-/ }"
              echo "- [$label](../${path#docs/})"
            done
          } > docs/automation/generated-index.md

      - name: Commit docs index when changed
        run: |
          if git diff --quiet -- docs/automation/generated-index.md; then
            echo "Documentation index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/automation/generated-index.md
          git commit -m "docs: update generated documentation index" -m "Co-authored-by: HUMURA ELVIN <148461063+humuraelvin@users.noreply.github.com>"
          git push origin HEAD:main
