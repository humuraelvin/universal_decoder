name: Generate documentation index

'on':
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docs index
        run: |
          mkdir -p docs/automation
          {
            echo "# Documentation Index"
            echo
            echo 'Generated from the Markdown files in the `docs/` folder.'
            echo
            find docs -type f -name '*.md' ! -path 'docs/automation/generated-index.md' | sort | while IFS= read -r path; do
              base="${path##*/}"
              label="${base%.md}"
              label="${label//-/ }"
              echo "- [$label](../${path#docs/})"
            done
          } > docs/automation/generated-index.md

      - name: Open generated-index pull request
        env:
          GH_TOKEN: ${{ github.token }}
          COAUTHOR: HUMURA ELVIN <148461063+humuraelvin@users.noreply.github.com>
        run: |
          branch="automation/docs-index-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/automation/generated-index.md
          git commit -m "docs: generate documentation index" -m "Co-authored-by: $COAUTHOR"
          git push --set-upstream origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --title "docs: generate documentation index" --body "Generated a docs index from the repository documentation folder." --base main --head "$branch"
